<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to YOVA Collections | Timeless Rolled Gold Jewellery</title>
  <meta name="description" content="Welcome to YOVA Collections. Handcrafted South Indian rolled gold jewellery, temple collections, bridal harams, chokers, and bangles. Timeless Gold. Crafted for You.">
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="images/yova_logo.png">

  <!-- Google Fonts: Cinzel + Playfair Display + Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* ==========================================================================
       YOVA COLLECTIONS - LUXURY WELCOME SCREEN
       Palette: Cream Ivory, Royal Burgundy Maroon, Antique Gold
       ========================================================================== */
    :root {
      --welcome-cream-bg: #FFF8ED;
      --welcome-cream-card: #FFFFFF;
      --welcome-cream-inner: #FFFCF7;
      --welcome-maroon-dark: #3D0F1A;
      --welcome-maroon-rich: #5A1623;
      --welcome-maroon-light: #7D2235;
      --welcome-gold-primary: #C69A36;
      --welcome-gold-light: #EDD68A;
      --welcome-gold-border: #DEC98A;
      --welcome-text-dark: #221410;
      --welcome-text-muted: #65544B;
      --welcome-text-subtle: #8C7D73;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body.welcome-body {
      min-height: 100vh;
      width: 100%;
      background-color: var(--welcome-cream-bg);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(237, 214, 138, 0.35) 0%, transparent 60%),
        radial-gradient(circle at 10% 90%, rgba(90, 22, 35, 0.05) 0%, transparent 50%),
        radial-gradient(circle at 90% 85%, rgba(198, 154, 54, 0.08) 0%, transparent 50%);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      color: var(--welcome-text-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.25rem;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient Decorative Corner Watermarks */
    .bg-motif {
      position: fixed;
      pointer-events: none;
      font-family: 'Cinzel', serif;
      font-size: 15rem;
      color: var(--welcome-maroon-dark);
      opacity: 0.035;
      user-select: none;
      line-height: 1;
      z-index: 0;
    }
    .motif-tl { top: -3.5rem; left: -3.5rem; }
    .motif-br { bottom: -3.5rem; right: -3.5rem; }

    /* ==========================================================================
       FULL-SCREEN CINEMATIC JEWELLERY BACKGROUND (CAMPAIGN AD AMBIENCE)
       ========================================================================== */
    .luxury-jewellery-backdrop {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none !important;
      user-select: none;
      z-index: 1;
      overflow: hidden;
      background-color: #FAF5EC;
    }

    /* Layer 1: Base high-resolution luxury ivory silk backdrop */
    .backdrop-base-wallpaper {
      position: absolute;
      inset: -5%;
      width: 110%;
      height: 110%;
      background-image: url('images/ivory_silk_backdrop.jpg');
      background-position: center center;
      background-size: cover;
      background-repeat: no-repeat;
      filter: brightness(1.02) contrast(1.02) saturate(1.05);
      transform: scale(1.02);
      animation: luxuryCameraPan 32s ease-in-out infinite alternate;
      will-change: transform;
    }

    /* Soft Studio Warm Champagne & Ivory Ambient Grading Film */
    .backdrop-colour-film {
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(ellipse at 50% 50%, rgba(255, 255, 255, 0.45) 0%, rgba(254, 250, 242, 0.35) 50%, rgba(245, 235, 215, 0.40) 100%),
        linear-gradient(135deg, rgba(255, 255, 255, 0.35) 0%, transparent 50%, rgba(237, 214, 138, 0.15) 100%);
      mix-blend-mode: normal;
      pointer-events: none;
    }

    /* Soft Warm Champagne Center Glow Halo (Elevating White Card) */
    .backdrop-center-halo {
      position: absolute;
      top: 50%;
      left: 50%;
      width: clamp(480px, 60vw, 760px);
      height: clamp(580px, 75vh, 880px);
      transform: translate(-50%, -50%);
      background: radial-gradient(ellipse at center, rgba(237, 214, 138, 0.38) 0%, rgba(198, 154, 54, 0.16) 40%, rgba(255, 255, 255, 0.05) 70%, transparent 100%);
      filter: blur(60px);
      -webkit-filter: blur(60px);
      animation: haloBreathe 16s ease-in-out infinite alternate;
      pointer-events: none;
    }

    /* Layer 2: Editorial Flank Visuals (Real Jewellery on Ivory Silk) */
    .editorial-flank {
      position: absolute;
      top: 50%;
      height: 92vh;
      max-height: 940px;
      pointer-events: none;
      filter: brightness(0.98) contrast(1.05) drop-shadow(0 15px 35px rgba(185, 150, 105, 0.22));
      transition: opacity 0.5s ease;
      will-change: transform;
    }

    .editorial-flank-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      display: block;
    }

    /* Left: Antique-Gold Temple Necklace on Ivory Silk (Bleeding off left edge) */
    .flank-left {
      left: -2vw;
      width: clamp(340px, 31vw, 540px);
      transform: translateY(-50%);
      -webkit-mask-image: 
        linear-gradient(to right, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0.95) 45%, rgba(0, 0, 0, 0.35) 75%, transparent 100%),
        linear-gradient(to bottom, transparent 0%, rgba(0,0,0,1) 8%, rgba(0,0,0,1) 92%, transparent 100%);
      -webkit-mask-composite: destination-in;
      mask-image: 
        linear-gradient(to right, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0.95) 45%, rgba(0, 0, 0, 0.35) 75%, transparent 100%),
        linear-gradient(to bottom, transparent 0%, rgba(0,0,0,1) 8%, rgba(0,0,0,1) 92%, transparent 100%);
      mask-composite: intersect;
      opacity: 0.90;
      animation: leftFlankDrift 26s ease-in-out infinite alternate;
    }

    /* Right: Matching Antique-Gold Jhumkas on Ivory Silk (Bleeding off right edge) */
    .flank-right {
      right: -2vw;
      width: clamp(320px, 29vw, 500px);
      transform: translateY(-50%);
      -webkit-mask-image: 
        linear-gradient(to left, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0.95) 45%, rgba(0, 0, 0, 0.35) 75%, transparent 100%),
        linear-gradient(to bottom, transparent 0%, rgba(0,0,0,1) 8%, rgba(0,0,0,1) 92%, transparent 100%);
      -webkit-mask-composite: destination-in;
      mask-image: 
        linear-gradient(to left, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0.95) 45%, rgba(0, 0, 0, 0.35) 75%, transparent 100%),
        linear-gradient(to bottom, transparent 0%, rgba(0,0,0,1) 8%, rgba(0,0,0,1) 92%, transparent 100%);
      mask-composite: intersect;
      opacity: 0.90;
      animation: rightFlankDrift 28s ease-in-out infinite alternate;
    }

    /* Layer 3: Slow Elegant Light Sweep across the gold jewellery */
    .gold-sheen-sweep {
      position: absolute;
      inset: -50% -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        115deg,
        transparent 0%,
        transparent 44%,
        rgba(255, 255, 255, 0.15) 48%,
        rgba(255, 250, 235, 0.45) 50%,
        rgba(237, 214, 138, 0.20) 52%,
        transparent 56%,
        transparent 100%
      );
      mix-blend-mode: soft-light;
      pointer-events: none;
      animation: lightSweepLoop 11s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    /* Layer 4: Refined Precision Gold Glints on Jewellery Details */
    .jewellery-glint {
      position: absolute;
      width: 14px;
      height: 14px;
      pointer-events: none;
      transform: translate(-50%, -50%);
    }

    .jewellery-glint::before,
    .jewellery-glint::after {
      content: '';
      position: absolute;
      background: #FFFFFF;
      box-shadow: 0 0 12px 2px rgba(237, 214, 138, 0.95);
      border-radius: 999px;
    }

    .jewellery-glint::before {
      top: 50%;
      left: 0;
      right: 0;
      height: 2px;
      transform: translateY(-50%);
    }

    .jewellery-glint::after {
      left: 50%;
      top: 0;
      bottom: 0;
      width: 2px;
      transform: translateX(-50%);
    }

    .glint-left-pendant {
      left: 14vw;
      top: 48vh;
      animation: precisionGlint 8.5s ease-in-out infinite;
      animation-delay: 1.5s;
    }

    .glint-right-jhumka {
      right: 13vw;
      top: 42vh;
      animation: precisionGlint 9.5s ease-in-out infinite;
      animation-delay: 5s;
    }

    .glint-top-accent {
      left: 50%;
      top: 14vh;
      animation: precisionGlint 10.5s ease-in-out infinite;
      animation-delay: 8s;
    }

    /* Animations */
    @keyframes luxuryCameraPan {
      0% {
        transform: scale(1.02) translate(0, 0);
      }
      50% {
        transform: scale(1.07) translate(-1.2%, -1%);
      }
      100% {
        transform: scale(1.04) translate(1.4%, 1.2%);
      }
    }

    @keyframes haloBreathe {
      0% {
        transform: translate(-50%, -50%) scale(0.94);
        opacity: 0.65;
      }
      50% {
        transform: translate(-50%, -50%) scale(1.08);
        opacity: 0.95;
      }
      100% {
        transform: translate(-50%, -50%) scale(0.98);
        opacity: 0.72;
      }
    }

    @keyframes leftFlankDrift {
      0% {
        transform: translateY(-50%) scale(1) translate(0, 0);
      }
      50% {
        transform: translateY(-50%) scale(1.03) translate(10px, -12px);
      }
      100% {
        transform: translateY(-50%) scale(0.99) translate(-8px, 10px);
      }
    }

    @keyframes rightFlankDrift {
      0% {
        transform: translateY(-50%) scale(1) translate(0, 0);
      }
      50% {
        transform: translateY(-50%) scale(1.03) translate(-12px, -10px);
      }
      100% {
        transform: translateY(-50%) scale(0.99) translate(8px, 12px);
      }
    }

    @keyframes lightSweepLoop {
      0%, 15% {
        transform: translate(-80%, -80%) rotate(0deg);
        opacity: 0;
      }
      28% {
        opacity: 0.6;
      }
      45%, 100% {
        transform: translate(65%, 65%) rotate(0deg);
        opacity: 0;
      }
    }

    @keyframes precisionGlint {
      0%, 75%, 100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.2) rotate(0deg);
      }
      82% {
        opacity: 0.95;
        transform: translate(-50%, -50%) scale(1.2) rotate(45deg);
      }
      90% {
        opacity: 0.15;
        transform: translate(-50%, -50%) scale(0.5) rotate(90deg);
      }
    }

    /* Accessibility: Respect Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      .backdrop-base-wallpaper,
      .backdrop-center-halo,
      .flank-left,
      .flank-right,
      .gold-sheen-sweep,
      .jewellery-glint {
        animation: none !important;
        transform: none !important;
      }
    }

    /* Responsive Adjustments */
    @media (max-width: 1024px) {
      .flank-left {
        left: -8vw;
        opacity: 0.45;
        width: 38vw;
      }
      .flank-right {
        right: -8vw;
        opacity: 0.42;
        width: 36vw;
      }
    }

    @media (max-width: 768px) {
      .flank-left {
        left: -14vw;
        opacity: 0.28;
        width: 48vw;
      }
      .flank-right {
        right: -14vw;
        opacity: 0.25;
        width: 46vw;
      }
      .backdrop-center-halo {
        width: 90vw;
        height: 70vh;
      }
    }

    /* Welcome Card Container */
    .welcome-container {
      width: 100%;
      max-width: 520px;
      position: relative;
      z-index: 10;
      margin: auto;
      animation: cardFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes cardFadeIn {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .welcome-card {
      background: var(--welcome-cream-card);
      border: 1.5px solid rgba(222, 201, 138, 0.7);
      border-radius: 28px;
      box-shadow: 
        0 28px 80px rgba(61, 15, 26, 0.09),
        0 8px 24px rgba(198, 154, 54, 0.08);
      padding: 3.25rem 2.5rem 2.75rem;
      position: relative;
      overflow: hidden;
      text-align: center;
      transition: all 0.3s ease;
    }

    /* Top Gold Foil Bar */
    .welcome-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #EDD68A 0%, #C69A36 50%, #EDD68A 100%);
    }

    /* Centered Brand Header */
    .brand-header {
      margin-bottom: 2rem;
    }

    .logo-wrapper {
      display: inline-block;
      margin-bottom: 1.25rem;
      position: relative;
    }

    .logo-img {
      height: 86px;
      width: auto;
      max-width: 320px;
      object-fit: contain;
      filter: drop-shadow(0 6px 16px rgba(61, 15, 26, 0.12));
      transition: transform 0.4s ease;
    }

    .welcome-card:hover .logo-img {
      transform: scale(1.03);
    }

    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--welcome-maroon-dark);
      text-transform: uppercase;
      margin-bottom: 0.35rem;
      line-height: 1.2;
    }

    .brand-subtitle {
      font-family: 'Playfair Display', serif;
      font-size: 0.92rem;
      font-style: italic;
      color: var(--welcome-gold-primary);
      letter-spacing: 0.05em;
    }

    /* Golden Filigree Divider */
    .gold-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.85rem;
      margin: 1.5rem auto 1.85rem;
      width: 70%;
    }

    .gold-divider .line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--welcome-gold-border), transparent);
    }

    .gold-divider .star {
      color: var(--welcome-gold-primary);
      font-size: 0.9rem;
    }

    /* Taglines Section */
    .taglines-container {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      margin-bottom: 2.25rem;
    }

    .tagline-item {
      background: var(--welcome-cream-inner);
      border: 1px solid rgba(222, 201, 138, 0.6);
      border-radius: 14px;
      padding: 0.85rem 1.15rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      transition: all 0.3s ease;
      box-shadow: 0 2px 8px rgba(90, 22, 35, 0.02);
      width: 100%;
      cursor: pointer;
      font-family: inherit;
      outline: none;
    }

    .tagline-item:hover {
      background: #FFFFFF;
      border-color: var(--welcome-gold-primary);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(198, 154, 54, 0.12);
    }

    .tagline-item:active {
      transform: scale(0.98);
      background: #FFFDF8;
      box-shadow: 0 2px 6px rgba(198, 154, 54, 0.18);
    }

    .tagline-item:focus-visible {
      outline: 2px solid var(--welcome-gold-primary);
      outline-offset: 2px;
    }

    .tagline-sparkle {
      color: var(--welcome-gold-primary);
      font-size: 0.85rem;
      line-height: 1;
      flex-shrink: 0;
    }

    .tagline-text {
      font-family: 'Playfair Display', serif;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--welcome-maroon-rich);
      letter-spacing: 0.02em;
    }

    /* Action CTA: Enter Collection Button */
    .action-container {
      margin-top: 0.5rem;
    }

    .btn-enter-collection {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      width: 100%;
      background: linear-gradient(135deg, var(--welcome-maroon-dark) 0%, var(--welcome-maroon-rich) 50%, var(--welcome-maroon-light) 100%);
      color: #FFFFFF;
      text-decoration: none;
      border: 1px solid var(--welcome-gold-border);
      border-radius: 16px;
      padding: 1.05rem 2rem;
      font-size: 1.08rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-family: 'Cinzel', serif;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(61, 15, 26, 0.26);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }

    .btn-enter-collection::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(237, 214, 138, 0.35), transparent);
      transition: left 0.6s ease;
    }

    .btn-enter-collection:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 32px rgba(61, 15, 26, 0.34);
      border-color: var(--welcome-gold-primary);
      color: #FFFFFF;
    }

    .btn-enter-collection:hover::before {
      left: 100%;
    }

    .btn-enter-collection:active {
      transform: translateY(-1px);
    }

    .btn-arrow-icon {
      transition: transform 0.3s ease;
    }

    .btn-enter-collection:hover .btn-arrow-icon {
      transform: translateX(4px);
    }

    /* Trust Footnote */
    .welcome-footnote {
      margin-top: 1.75rem;
      font-size: 0.78rem;
      color: var(--welcome-text-subtle);
      text-align: center;
      letter-spacing: 0.04em;
    }

    /* Mobile Responsive Optimizations */
    @media (max-width: 480px) {
      body.welcome-body {
        padding: 1.5rem 1rem;
      }
      .welcome-card {
        padding: 2.25rem 1.5rem 2rem;
        border-radius: 22px;
      }
      .logo-img {
        height: 70px;
      }
      .brand-title {
        font-size: 1.55rem;
      }
      .brand-subtitle {
        font-size: 0.82rem;
      }
      .tagline-text {
        font-size: 0.95rem;
      }
      .btn-enter-collection {
        padding: 0.95rem 1.5rem;
        font-size: 0.98rem;
      }
    }
  </style>
</head>

<body class="welcome-body">

  <!-- ==========================================================================
       FULL-SCREEN CINEMATIC JEWELLERY BACKGROUND (EDITORIAL CAMPAIGN)
       Strictly pointer-events: none behind all interactive content
       ========================================================================== -->
  <div class="luxury-jewellery-backdrop" aria-hidden="true">
    <!-- Layer 1: High-resolution ivory silk backdrop with slow camera-pan -->
    <div class="backdrop-base-wallpaper"></div>

    <!-- Layer 1b: Soft Warm Champagne & Studio Ambient Grading Film -->
    <div class="backdrop-colour-film"></div>

    <!-- Layer 2: Soft Warm Gold Center Halo behind Welcome Card -->
    <div class="backdrop-center-halo"></div>

    <!-- Layer 3: Editorial Flanks with South Indian antique jewellery on ivory silk -->
    <!-- Left Flank: Antique Temple Haram / Necklace on Ivory Silk -->
    <div class="editorial-flank flank-left">
      <img src="images/temple_necklace_ivory.jpg" alt="" class="editorial-flank-img" loading="eager">
    </div>

    <!-- Right Flank: Matching Antique Jhumkas on Ivory Silk -->
    <div class="editorial-flank flank-right">
      <img src="images/antique_jhumkas_ivory.jpg" alt="" class="editorial-flank-img" loading="eager">
    </div>

    <!-- Layer 4: Cinematic Light Sweep Across the Gold Jewellery -->
    <div class="gold-sheen-sweep"></div>

    <!-- Layer 5: Refined Precision Gold Glints -->
    <div class="jewellery-glint glint-left-pendant"></div>
    <div class="jewellery-glint glint-right-jhumka"></div>
    <div class="jewellery-glint glint-top-accent"></div>
  </div>

  <!-- Subtle Background Watermarks -->
  <div class="bg-motif motif-tl" aria-hidden="true">✦</div>
  <div class="bg-motif motif-br" aria-hidden="true">✦</div>

  <!-- Centered Welcome Card -->
  <main class="welcome-container">
    <div class="welcome-card">

      <!-- Top Center Brand Identity -->
      <header class="brand-header">
        <div class="logo-wrapper">
          <img src="images/yova_logo.png" alt="YOVA Collections" class="logo-img">
        </div>
        <h1 class="brand-title">YOVA Collections</h1>
        <p class="brand-subtitle">Artisanal Rolled Gold &amp; Heritage Jewellery</p>

        <!-- Golden Filigree Divider -->
        <div class="gold-divider" aria-hidden="true">
          <span class="line"></span>
          <span class="star">✦</span>
          <span class="line"></span>
        </div>
      </header>

      <!-- The 3 Brand Taglines (Clickable Tabs) -->
      <section class="taglines-container" aria-label="Brand Taglines">
        <button type="button" class="tagline-item" aria-label="Timeless Gold. Crafted for You.">
          <span class="tagline-sparkle" aria-hidden="true">✦</span>
          <span class="tagline-text">“Timeless Gold. Crafted for You.”</span>
        </button>

        <button type="button" class="tagline-item" aria-label="Where Every Moment Shines.">
          <span class="tagline-sparkle" aria-hidden="true">✦</span>
          <span class="tagline-text">“Where Every Moment Shines.”</span>
        </button>

        <button type="button" class="tagline-item" aria-label="Luxury for Every Celebration.">
          <span class="tagline-sparkle" aria-hidden="true">✦</span>
          <span class="tagline-text">“Luxury for Every Celebration.”</span>
        </button>
      </section>

      <!-- Enter Collection Action Button -->
      <div class="action-container">
        <a href="home.html" class="btn-enter-collection" id="enterCollectionBtn" aria-label="Enter YOVA Collections Boutique Home Page">
          <span>Enter Collection</span>
          <svg class="btn-arrow-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </a>
      </div>
